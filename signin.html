<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Crochet by Kash</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand ms-4 d-flex align-items-center" href="#">
        <i class="fa fa-user-circle" style="font-size:28px;color:purple;"></i>
        <span class="ms-2" id="profileName">Guest</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">ABOUT OUR CRAFT</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">PRODUCT GALLERY</a></li>
          <li class="nav-item"><a class="nav-link" href="explore.html">EXPLORE MORE</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Sign In</h1>
      <p class="auth-subtitle">Welcome back. Log in to continue shopping.</p>
      <form id="signinForm">
        <div class="mb-3">
          <label for="signinUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="signinUsername" placeholder="Enter your username" required>
        </div>
        <div class="mb-3">
          <label for="signinPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="signinPassword" placeholder="Enter your password" required>
        </div>
        <div class="auth-message text-danger" id="signinMessage"></div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
      <button type="button" class="btn btn-google w-100 mt-3" id="googleAuth">
        <i class="fa fa-google"></i> Continue with Google
      </button>
      <p class="mt-4 text-center">Don’t have an account? <a href="signup.html">Create one</a></p>
    </div>
  </main>

  <footer class="auth-footer">
    <p>Shopping made simple with Crochet by Kash.</p>
  </footer>

  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
